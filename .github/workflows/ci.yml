name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Test, Build, and Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: sqlite:////tmp/mradi_ci.sqlite3
      AUTH_BYPASS: "true"
      LOCAL_STORAGE_ROOT: ./test-local-storage
      API_BASE_URL: http://testserver
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: test-clerk-publishable-key
      CLERK_SECRET_KEY: test-clerk-secret-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.11"
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "apps/api[dev]" pip-audit

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, API, component, agent, risk, upload, security, and PDF tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Python dependency security scan
        run: python -m pip_audit --local --skip-editable

      - name: Node dependency security scan
        run: pnpm audit --prod --audit-level moderate
